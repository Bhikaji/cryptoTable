[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infynex-quant-ai"
version = "0.1.0"
description = "INFYNEX QUANT AI - adaptive reinforcement-learning subsystem for reward, penalty and continuous improvement of crypto scalping decisions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bhikaji/cryptoTable" }]
keywords = ["trading", "reinforcement-learning", "reward-engine", "quant"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27", "joblib>=1.3"]

[project.scripts]
infynex-quant = "app.main:run"

[tool.setuptools]
packages = ["ai", "core", "app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
